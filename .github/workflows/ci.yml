name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: 2.11.4

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libdbus-1-dev \
            pkg-config \
            qml6-module-qtquick \
            qt6-declarative-dev-tools

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check QML formatting and syntax
        shell: bash
        run: |
          set -euo pipefail
          qml_files=(
            crates/cli/assets/noctalia/Main.qml
            crates/cli/assets/noctalia/BarWidget.qml
            crates/cli/assets/noctalia/Panel.qml
          )
          for file in "${qml_files[@]}"; do
            diff -u "$file" <(qmlformat "$file")
          done
          qmllint \
            --import info \
            --unqualified info \
            --required info \
            --signal-handler-parameters info \
            --unresolved-type info \
            "${qml_files[@]}"

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Verify publishable package contents
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            llm-meter-core
            llm-meter-storage
            llm-meter-secret-store
            llm-meter-provider-openai
            llm-meter-provider-kimi
            llm-meter-relay-proxy
            llm-meter-provider-relay
            llm-meter-provider-testkit
            llm-meter-daemon
            llm-meter-cli
          )
          for package in "${packages[@]}"; do
            cargo package --locked --allow-dirty --list -p "$package" >/dev/null
          done
          cargo package --locked --allow-dirty -p llm-meter-core

      - name: Check distributable integration assets
        shell: bash
        run: |
          set -euo pipefail
          for file in manifest.json Main.qml BarWidget.qml Panel.qml; do
            cmp "crates/cli/assets/noctalia/$file" "packaging/noctalia/llm-meter/$file"
          done
          for file in llm-meter.lua llm-meter.conf; do
            cmp "crates/cli/assets/hyprland/$file" "packaging/hyprland/$file"
          done

  desktop:
    name: Tauri desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check desktop application
        run: cargo check --all-targets --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows:
    name: Windows workspace and desktop
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Windows workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Windows tests
        run: cargo test --workspace --locked

      - name: Run Windows Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Stage Windows sidecars
        shell: pwsh
        run: |
          cargo build --locked --bin llm-meter --bin llm-meterd
          $target = (rustc -vV | Select-String '^host: ').Line.Substring(6)
          $sidecarDir = 'apps/desktop/src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $sidecarDir | Out-Null
          Copy-Item `
            'target/debug/llm-meter.exe' `
            "$sidecarDir/llm-meter-$target.exe"
          Copy-Item `
            'target/debug/llm-meterd.exe' `
            "$sidecarDir/llm-meterd-$target.exe"

      - name: Generate Windows icon from the source PNG
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File
          apps/desktop/src-tauri/scripts/generate-windows-icon.ps1

      - name: Check Windows desktop application
        run: cargo check --all-targets --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run Windows desktop tests
        run: cargo test --all-targets --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run Windows desktop Clippy
        run: cargo clippy --all-targets --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "=$env:TAURI_CLI_VERSION" --locked

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          Push-Location 'apps/desktop'
          cargo tauri build --debug --bundles nsis -- --locked
          Pop-Location

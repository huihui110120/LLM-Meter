[package]
name = "llm-meter-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line client and daemon executables for LLM Meter"
[dependencies]
clap.workspace = true
llm-meter-core = { version = "0.2.0", path = "../core" }
llm-meter-daemon = { version = "0.2.0", path = "../daemon" }
llm-meter-ipc = { version = "0.2.0", path = "../ipc" }
llm-meter-secret-store = { version = "0.2.0", path = "../secret-store" }
rpassword.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_TaskScheduler",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "llm-meter"
path = "src/main.rs"

[[bin]]
name = "llm-meterd"
path = "src/daemon.rs"
